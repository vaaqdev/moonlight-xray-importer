name: Build macOS Catalina Portable
on:
  push:
    branches: [build/macos-catalina]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-catalina-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: '10.15'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v5
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.3.2
          arch: clang_64
          cache: true
      - uses: actions/setup-go@v5
        with:
          go-version: 1.22.12
          cache: false
      - name: Install build tools
        run: brew install nasm meson ninja pkg-config
      - name: Restore Catalina dependencies
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: libs/mac
          # Bump when native dependency sources or build flags change.
          key: catalina-intel-native-v1-250e121d2bd0ecbd622883140774c23387a3e8e6d9a412aa63201e6be51bb2a1
      - name: Build Catalina libraries
        if: steps.deps.outputs.cache-hit != 'true'
        run: bash scripts/build-macos-catalina.sh --deps-only
      - name: Save Catalina dependencies before compiling app
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: libs/mac
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Build and verify Catalina portable app
        run: bash scripts/build-macos-catalina.sh --app-only
      - uses: actions/upload-artifact@v6
        with:
          name: Moonlight-6.2.0-macOS-10.15-Catalina-Portable-Intel
          path: build/catalina-portable/*
          if-no-files-found: error
          compression-level: 0
